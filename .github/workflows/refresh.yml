name: Refresh dashboard data

# Builds all CI-buildable dashboard data fresh from DC's public ArcGIS API and
# deploys the whole site as a GitHub Pages *artifact* — nothing is committed back
# to main. This stops the repo's git history from growing ~15 MB every month
# (the old model re-committed agg/*.json on every run). See DCD7.
#
# Built here (fetched from ArcGIS, no credentials):
#   * agg/*_alerts.json + agg/signals.json     — Complaint Radar signals (fetch+build)
#   * agg.json + dashboards                     — submission volume (refresh_submission)
#   * agg/categories.json, agg/anomalies.json   — category + ward-anomaly boards
#   * agg/smd.json, agg/smd_boundaries.min.geojson — SMD chart + choropleth (smd.py)
#
# NOT built here (kept as committed source, refreshed manually — see README):
#   * submission METHOD/source numbers — derived from external snap311 CSVs that
#     CI doesn't have (refresh_methods.py). They live in the committed agg.json
#     seed + inline dashboard DATA; refresh_submission only touches volume, so the
#     method data is preserved.
#
# Cadence: monthly (DC's data lags and backfills, so daily is redundant).

on:
  schedule:
    - cron: "0 8 1 * *" # 08:00 UTC on the 1st of every month
  workflow_dispatch: # allow manual "Run workflow" from the Actions tab
    inputs:
      skip_build:
        description: "Deploy the committed site as-is (skip the data fetch/build). Publishes in ~40s — use to ship a code/UI change without re-pulling data."
        type: boolean
        default: false

# Pages-artifact deploy needs these; no `contents: write` — nothing is pushed back.
permissions:
  contents: read
  pages: write
  id-token: write

# Standard Pages concurrency group; don't cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # first run cold-fetches all radar signals + ~3.6M SMD points
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Everything from here down to Guardrail rebuilds data and is skipped when
      # skip_build=true (fast deploy-only: just stage the committed site + deploy).
      - name: Set up Python
        if: ${{ !inputs.skip_build }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Carry per-year checkpoint CSVs (radar signals + SMD points) + the cached
      # SMD boundary geojson between runs so we only pull the current partial year,
      # not all history. `data/raw/` is gitignored (except the committed
      # neighborhood_names.geojson), so this cache is the only thing that persists
      # the fetched raw data. run_id-suffixed key always misses -> re-saved each
      # run with the newest year folded in; restore-keys seeds from the latest.
      - name: Restore raw-data checkpoints
        if: ${{ !inputs.skip_build }}
        uses: actions/cache@v4
        with:
          path: data/raw
          key: dc311-raw-${{ github.run_id }}
          restore-keys: |
            dc311-raw-

      - name: Install dependencies
        if: ${{ !inputs.skip_build }}
        run: pip install -r pipeline/requirements.txt

      # Force the current, still-growing year to be re-pulled (fetch.py + smd.py
      # treat an existing per-year checkpoint as final; this matches "_<signal>_"
      # and "_smd_pts_" checkpoints alike).
      - name: Invalidate current-year checkpoints
        if: ${{ !inputs.skip_build }}
        run: rm -f data/raw/_*_$(date -u +%Y).csv

      # Complaint Radar / early-warning: pull every configured signal and rebuild
      # all per-signal alerts + the signals.json manifest the picker reads.
      - name: Fetch radar source data
        if: ${{ !inputs.skip_build }}
        run: python pipeline/fetch.py
      - name: Build radar aggregates
        if: ${{ !inputs.skip_build }}
        run: python pipeline/build.py

      # Submission-volume: refresh the current year straight from the live API
      # (rewrites agg.json + the embedded DATA in dashboard.html/index.html).
      - name: Refresh submission volume
        if: ${{ !inputs.skip_build }}
        run: python pipeline/refresh_submission.py

      # Complaint categories + per-ward anomaly board.
      - name: Build complaint-category breakdown
        if: ${{ !inputs.skip_build }}
        run: python pipeline/categories.py
      - name: Build per-ward anomaly board
        if: ${{ !inputs.skip_build }}
        run: python pipeline/anomaly.py

      # SMD chart + choropleth data (point-in-polygon; reuses cached history via
      # its fetch manifest, only re-pulls the current year).
      - name: Build SMD aggregates
        if: ${{ !inputs.skip_build }}
        run: python pipeline/smd.py

      # Sanity-gate the freshly built artifacts. On failure the job stops here, no
      # deploy runs, and the last good Pages deploy stays live.
      - name: Guardrail (build sanity)
        if: ${{ !inputs.skip_build }}
        run: python pipeline/guardrail.py

      # Stage the public site: everything except source/tooling. agg/ (freshly
      # built), agg.json, dashboards, exports and assets are all included.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'pipeline' \
            --exclude 'data' --exclude '.venv' --exclude '_site' \
            ./ _site/
          echo "Staged $(find _site -type f | wc -l) files:"
          ls -la _site _site/agg

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
