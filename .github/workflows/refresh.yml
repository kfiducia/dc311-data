name: Refresh dashboard data

# Builds all CI-buildable dashboard data fresh from DC's public ArcGIS API and
# deploys the whole site as a GitHub Pages *artifact* — nothing is committed back
# to main. This stops the repo's git history from growing ~15 MB every month
# (the old model re-committed agg/*.json on every run). See DCD7.
#
# Built here (fetched from ArcGIS, no credentials):
#   * agg/*_alerts.json + agg/signals.json     — Complaint Radar signals (fetch+build)
#   * agg.json + dashboards                     — submission volume (refresh_submission)
#   * agg/categories.json, agg/anomalies.json   — category + ward-anomaly boards
#   * agg/smd.json, agg/smd_boundaries.min.geojson — SMD chart + choropleth (smd.py)
#   * agg/area_trends/*  — area-trends.html monthly per-area cubes (area_trends.py)
#   * agg/rats/*  — rat-report export consumed by abatement.home-rule.org (rats.py).
#     A PUBLISHED CONTRACT: that site's cron polls agg/rats/meta.json and reloads
#     when `generated` changes. A deploy-only run (skip_build) publishes WITHOUT
#     agg/rats/ (it's never committed); the consumer keeps its last good copy.
#
# Spliced in, NOT pulled here:
#   * submission METHOD/source numbers — pulled from DC's live 311 API by
#     methods.yml (Sundays, homelab k3s runner) and committed as data/methods.json.
#     This run only splices that file into agg.json + the dashboards
#     (refresh_methods.py --splice), so this job stays the only writer of agg.json
#     and a methods.yml outage never blocks a deploy.
#
# Cadence: weekly, so the abatement coordinator's rat history stays within about a
# week of DC. Raw checkpoints are only COMMITTED on the first run of each month
# (see the last step) — weekly commits of the ~45 MB current-year CSV would bloat
# the git history four times faster for no benefit, since every run re-pulls the
# current year anyway.

on:
  schedule:
    - cron: "0 8 * * 1" # 08:00 UTC every Monday
  workflow_dispatch: # allow manual "Run workflow" from the Actions tab
    inputs:
      skip_build:
        description: "Deploy the committed site as-is (skip the data fetch/build). Publishes in ~40s — use to ship a code/UI change without re-pulling data."
        type: boolean
        default: false

# Pages-artifact deploy needs pages/id-token; contents:write lets the full run
# commit refreshed raw-data checkpoints back to main (DCD8) so the next run only
# fetches the current year.
permissions:
  contents: write
  pages: write
  id-token: write

# Standard Pages concurrency group; don't cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # first run cold-fetches all radar signals + ~3.6M SMD points
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Everything from here down to Guardrail rebuilds data and is skipped when
      # skip_build=true (fast deploy-only: just stage the committed site + deploy).
      - name: Set up Python
        if: ${{ !inputs.skip_build }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # DCD8: the per-year raw checkpoints live IN git (see .gitignore), so the
      # checkout already carries all prior years — no Actions cache needed. The
      # "Invalidate current-year checkpoints" step below forces just the current,
      # still-growing year to be re-pulled; everything else is reused as-is.
      - name: Install dependencies
        if: ${{ !inputs.skip_build }}
        run: pip install -r pipeline/requirements.txt

      # Pipeline unit tests (stdlib unittest; no data or network needed).
      - name: Pipeline unit tests
        if: ${{ !inputs.skip_build }}
        run: python -m unittest discover -s pipeline -p 'test_*.py'

      # Force the current, still-growing year to be re-pulled (fetch.py + smd.py
      # treat an existing per-year checkpoint as final; this matches "_<signal>_"
      # and "_smd_pts_" checkpoints alike).
      - name: Invalidate current-year checkpoints
        if: ${{ !inputs.skip_build }}
        run: rm -f data/raw/_*_$(date -u +%Y).csv

      # Complaint Radar / early-warning: pull every configured signal and rebuild
      # all per-signal alerts + the signals.json manifest the picker reads.
      - name: Fetch radar source data
        if: ${{ !inputs.skip_build }}
        run: python pipeline/fetch.py
      - name: Build radar aggregates
        if: ${{ !inputs.skip_build }}
        run: python pipeline/build.py

      # Submission-volume: rebuild the current year from the checkpoint fetch.py just
      # wrote (no second ArcGIS pull unless its row count != the live count), then
      # rewrite agg.json + the embedded DATA in dashboard.html/index.html.
      - name: Refresh submission volume
        if: ${{ !inputs.skip_build }}
        run: python pipeline/refresh_submission.py

      # Submission methods: splice the committed data/methods.json (written by
      # methods.yml on Sundays) into agg.json + the dashboards' embedded DATA.
      - name: Splice submission methods
        if: ${{ !inputs.skip_build }}
        run: python pipeline/refresh_methods.py --splice

      # Complaint categories + per-ward anomaly board.
      - name: Build complaint-category breakdown
        if: ${{ !inputs.skip_build }}
        run: python pipeline/categories.py
      - name: Build per-ward anomaly board
        if: ${{ !inputs.skip_build }}
        run: python pipeline/anomaly.py

      # SMD chart + choropleth data (point-in-polygon; reuses cached history via
      # its fetch manifest, only re-pulls the current year).
      - name: Build SMD aggregates
        if: ${{ !inputs.skip_build }}
        run: python pipeline/smd.py

      # Area-trends page: monthly Ward/ANC/SMD x category cubes, one file per area
      # (reads the _all_ checkpoints + cached SMD boundaries; no network).
      - name: Build area trends
        if: ${{ !inputs.skip_build }}
        run: python pipeline/area_trends.py

      # Rat-report export for the abatement coordinator (reads the _all_ checkpoints;
      # fetches DC's city-block "Squares" layer itself).
      - name: Build rat-report export
        if: ${{ !inputs.skip_build }}
        run: python pipeline/rats.py

      # Sanity-gate the freshly built artifacts. On failure the job stops here, no
      # deploy runs, and the last good Pages deploy stays live.
      - name: Guardrail (build sanity)
        if: ${{ !inputs.skip_build }}
        run: python pipeline/guardrail.py

      # Stage the public site: everything except source/tooling. agg/ (freshly
      # built), agg.json, dashboards, exports and assets are all included.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'pipeline' \
            --exclude 'data' --exclude '.venv' --exclude '_site' \
            ./ _site/
          echo "Staged $(find _site -type f | wc -l) files:"
          ls -la _site _site/agg

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # DCD8: persist the refreshed raw checkpoints back to main so the next run
      # reuses them and only fetches the current year. Only current-year files
      # change (prior years are immutable), so the diff is small. Runs last, after
      # a successful deploy; skipped on deploy-only runs. refresh.yml has no push
      # trigger, so this commit does not re-trigger the workflow.
      # Scheduled runs commit only in the first week of the month (one commit per
      # month, as before the weekly cadence); manual runs always commit.
      # DCD19: also persist the submission-volume seed (agg.json + its embedded
      # copy in dashboard.html + the volume CSVs, ~0.5 MB). Without it, after each
      # January rollover refresh_submission re-pulls last year's hour-of-day from
      # ArcGIS on every run, because the committed seed still holds the mid-year
      # snapshot. Committing monthly makes that a one-time pull.
      - name: Commit refreshed raw data
        if: ${{ !inputs.skip_build }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%-d)" -gt 7 ]; then
            echo "Weekly run outside the month's first week — not committing raw data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw agg.json dashboard.html export_by_year.csv export_by_month.csv \
            export_source_counts.csv export_origin_counts.csv export_channel_counts.csv
          if git diff --cached --quiet; then
            echo "No raw-data changes to commit."
          else
            git commit -m "chore(data): refresh raw 311 checkpoints + volume seed (current year)"
            # methods.yml may have pushed data/sources since checkout (no shared files).
            # --autostash: the build leaves uncommitted generated files (agg/*.json, …),
            # and a plain `pull --rebase` refuses to run over them (failed 2026-11-19).
            git pull --rebase --autostash --quiet origin main
            git push origin HEAD:main
          fi
